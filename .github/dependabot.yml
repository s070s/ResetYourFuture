# DEP-1: automated dependency-update PRs and vulnerability alerting. Weekly, grouped to keep PR
# noise low for a solo maintainer.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      aspnetcore-efcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "NSubstitute"
          - "Shouldly"
          - "bunit"
    ignore:
      # DEP-4: Microsoft.OpenApi must stay on the 2.x line — 3.x is a breaking major for the
      # transitively dependent Microsoft.AspNetCore.OpenApi. Patch/minor bumps are fine.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The Playwright e2e suite under tests/e2e is a tracked npm manifest. It is local-only (not run
  # in CI), but leaving it out of Dependabot meant it got no update or vulnerability PRs at all.
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
