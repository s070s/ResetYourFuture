name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # DEP-10: needed to push the refreshed lock files back to a Dependabot branch. Dependabot
    # runs get a read-only token by default, so the grant has to be explicit.
    permissions:
      contents: write

    # Dummy values so the integration host (WebApplicationFactory<Program>) can boot.
    # Program.cs requires these at startup; none are real secrets.
    env:
      Jwt__Key: "ci-test-signing-key-not-a-secret-min-32-bytes!!"
      Jwt__Issuer: "ResetYourFuture.Tests"
      Jwt__Audience: "ResetYourFuture.Tests"
      AdminUser__Password: "Ci-Test-Admin-1!"

    steps:
      - uses: actions/checkout@v7
        with:
          # DEP-10: on a Dependabot branch, check out the branch itself rather than the
          # ephemeral merge commit, so the refreshed lock files can be committed back to it.
          # An empty ref keeps the default (merge-commit) behaviour for every other PR.
          ref: ${{ startsWith(github.head_ref, 'dependabot/') && github.head_ref || '' }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # BUILD-1: --locked-mode makes a silent package-version drift (e.g. the Microsoft.OpenApi
      # auto-pin trap) fail the restore loudly instead of quietly rewriting the pin.
      #
      # DEP-10: Dependabot bumps Directory.Packages.props but never regenerates the
      # CentralTransitive entries in the ten packages.lock.json files, so every dependency PR
      # would otherwise fail this restore with NU1004. On Dependabot branches we evaluate the
      # graph instead and commit the result back (below) -- so the run that refreshes the lock
      # files is the same run that builds and tests them. Every other branch keeps the guard.
      - name: Restore
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          case "$branch" in
            dependabot/*) dotnet restore ResetYourFuture.sln --force-evaluate ;;
            *)            dotnet restore ResetYourFuture.sln --locked-mode ;;
          esac

      - name: Build
        run: dotnet build ResetYourFuture.sln -c Release --no-restore

      # GOV-2: .editorconfig style rules are advisory in local builds but a hard gate here.
      # A file that drifts from the configured style (e.g. a block-scoped namespace where the
      # repo uses file-scoped) fails CI, so drift can't accumulate silently as it did before.
      # Scoped to `style --severity warn` (the warning-level IDE rules, currently clean); the
      # whitespace/paren reformatting backlog and analyzer-warnings-as-errors are deferred.
      - name: Verify code style
        run: dotnet format style ResetYourFuture.sln --verify-no-changes --severity warn --no-restore

      - name: Test
        run: dotnet test ResetYourFuture.sln -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      # DEP-10: push the regenerated lock files back to the Dependabot branch, so what merges is
      # what this run just built and tested. Deliberately placed after the test step: a bump that
      # fails the suite leaves no commit behind. A GITHUB_TOKEN push does not retrigger workflows,
      # which is fine here — this run is already the verification.
      - name: Commit refreshed lock files
        if: startsWith(github.head_ref, 'dependabot/')
        run: |
          if git diff --quiet -- '*packages.lock.json'; then
            echo "Lock files already in sync — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*packages.lock.json'
          git commit -m "Regenerate packages.lock.json for this dependency bump"
          git push origin "HEAD:${{ github.head_ref }}"

  # BUILD-2: the test suite runs on EF InMemory/SQLite, so a migration valid there but broken on
  # SQL Server (types, indexes, collation) would ship green and only fail at production startup.
  # This job applies the whole migration chain against a real SQL Server container.
  migrations:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Migrations-Sa-1!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci-Migrations-Sa-1!' -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    env:
      # The design-time DbContext factory reads this env var, so `dotnet ef` targets the container.
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=ResetYourFutureCiDb;User Id=sa;Password=Ci-Migrations-Sa-1!;TrustServerCertificate=True;Encrypt=False"

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # DEP-10: same conditional restore as the test job. This job never commits the result --
      # the test job owns that -- it just needs a coherent graph to run the migrations against.
      - name: Restore
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          case "$branch" in
            dependabot/*) dotnet restore ResetYourFuture.sln --force-evaluate ;;
            *)            dotnet restore ResetYourFuture.sln --locked-mode ;;
          esac

      - name: Restore tools (dotnet-ef)
        run: dotnet tool restore

      - name: Apply migrations to SQL Server
        run: dotnet ef database update --project src/ResetYourFuture.Infrastructure --startup-project src/ResetYourFuture.Web
